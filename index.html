<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TFT 3신기">
<meta name="theme-color" content="#ffffff">
<title>TFT 3신기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* VOICE: 게임 중 옆 화면에서 1초 만에 찾는 빠른 도구, 군더더기 없음
   IDEA: TFT 아이템 조합표 — 재료 두 개가 합쳐져 완성템이 되는 그 표
   PICTURE: 챔피언 카드 = 3신기 + 재료 칩, 재료 색이 곧 정보
   COLOUR/TYPE: 흰 바탕·검정 글씨, TFT 골드 포인트, 코스트 색은 게임 그대로 / Noto Sans KR
   LAYOUT: 왼쪽 특성 목록, 오른쪽 챔피언·아이템. 600px 아래는 위아래로 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121417);--ink:light-dark(#111111,#f2f2f2);--sub:light-dark(#555,#b5b5b5);
--line:light-dark(#e3e3e3,#2c3036);--card:light-dark(#f7f7f5,#1b1e22);--gold:light-dark(#a87b1f,#e0b651);--hl:light-dark(#fff6df,#2b2414)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR",system-ui,-apple-system,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--ink);padding:10px max(3vw,12px)}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1240px;margin:auto}
h1{font-size:22px;font-weight:900;margin:0;letter-spacing:-.5px;white-space:nowrap}
h1 b{color:var(--gold)}
.patch{font-size:13px;color:var(--sub)}
#q{flex:1 1 200px;font-size:16px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
.deckbtn{min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;white-space:nowrap}
.wrap{max-width:1240px;margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;padding:16px max(3vw,12px) 90px}
nav{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
nav h3{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:700}
nav h3:first-child{margin-top:0}
.tl{display:flex;flex-direction:column;gap:3px}
.tb{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;min-height:40px;font-weight:500}
.tb span{font-size:13px;color:var(--sub)}
.tb:hover{background:var(--card)}
.tb.on{background:var(--ink);color:var(--bg)}.tb.on span{color:var(--bg)}
main h2{font-size:32px;line-height:1.1;margin:0 0 4px;font-weight:900;letter-spacing:-1px}
.meta{color:var(--sub);font-size:15px;margin-bottom:16px}
.bp{display:inline-flex;gap:4px;margin-left:6px}
.bp i{font-style:normal;font-size:13px;font-weight:700;border:1.5px solid var(--line);border-radius:6px;padding:0 7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cc{border:1.5px solid var(--line);border-left:6px solid var(--cost);border-radius:12px;background:var(--bg);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.cc:hover{transform:translateY(-2px);border-color:var(--ink);border-left-color:var(--cost)}
.cc.sel{background:var(--hl);border-color:var(--gold);border-left-color:var(--cost)}
.cn{display:flex;align-items:baseline;gap:8px;font-size:19px;font-weight:900}
.cost{font-size:12px;font-weight:700;color:#fff;background:var(--cost);border-radius:5px;padding:1px 6px}
.ct{font-size:13px;color:var(--sub);word-break:keep-all;line-height:1.4}
body{word-break:keep-all}
.mini{display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:500}
.mini{gap:4px}.mini div{display:flex;gap:7px;align-items:center}
img{display:block;flex:none}.chd{display:flex;gap:12px;align-items:center}.pp{width:56px;height:56px;border-radius:10px;border:2px solid var(--cost)}.pl{width:76px;height:76px;border-radius:14px;border:3px solid var(--cost)}.ps{width:34px;height:34px;border-radius:7px;border:2px solid var(--cost)}.mi{width:22px;height:22px;border-radius:4px}.ci{width:24px;height:24px;border-radius:5px}.bi{width:52px;height:52px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.25)}.ai{width:38px;height:38px;border-radius:6px}
/* 상세 */
#det{margin-top:22px}
.main{display:block}
.ph0{border:2px dashed var(--line);border-radius:16px;padding:28px 18px;color:var(--sub);text-align:center}
@media(min-width:1120px){.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}#det{margin-top:0;position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto}.grid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}.ph h2{font-size:26px}}
.panel{border:2px solid var(--ink);border-radius:16px;padding:18px;background:var(--bg)}
.ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ph h2{font-size:30px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;font-size:14px;min-height:32px}
.chip:hover{border-color:var(--ink)}
.add{min-height:44px;padding:0 16px;border-radius:10px;border:2px solid var(--gold);background:var(--hl);font-weight:700}
.add.in{background:var(--gold);color:#fff}
.sec{font-size:14px;font-weight:700;color:var(--sub);margin:18px 0 8px}
.it{display:grid;grid-template-columns:28px 52px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.num{width:28px;height:28px;font-size:14px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900}
.iname{font-size:19px;font-weight:700;line-height:1.25}
.rec{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:14px;color:var(--sub)}
.cp{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:2px 9px 2px 2px;font-size:14px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.sum{display:flex;gap:6px;flex-wrap:wrap}
.sum .cp b{background:rgba(0,0,0,.25);border-radius:4px;padding:0 5px}
.alts{display:flex;flex-direction:column;gap:10px}
.alt{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;font-size:15px}
.alt .rec{margin-top:3px}
.note{font-size:14px;background:var(--card);border-radius:10px;padding:10px 12px;margin-top:12px;color:var(--sub)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
/* 덱 */
#deck{position:fixed;inset:auto 0 0 0;z-index:9;background:var(--bg);border-top:2px solid var(--ink);max-height:75vh;overflow:auto;padding:14px max(3vw,12px) 20px;transform:translateY(105%);transition:transform .2s}
#deck.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;max-width:1240px;margin:auto}
.dh h2{font-size:22px;margin:0}
.dbody{max-width:1240px;margin:10px auto 0}
.drow{display:grid;grid-template-columns:150px minmax(0,1fr) 36px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.drow b{font-size:16px;gap:8px}
.drow .x{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:none}
.ghost{min-height:40px;padding:0 12px;border-radius:8px;border:1.5px solid var(--line);background:none}
.empty{color:var(--sub);padding:24px 0}
footer{max-width:1240px;margin:0 auto;padding:0 max(3vw,12px) 100px;font-size:13px;color:var(--sub)}
footer a{color:var(--sub)}
@media(max-width:760px){
 .wrap{grid-template-columns:minmax(0,1fr);gap:12px}
 nav{display:flex;flex-direction:column;position:static;max-height:none;overflow:visible}
 .tl{flex-direction:row;flex-wrap:wrap;gap:6px}
 .tb{border:1.5px solid var(--line);padding:6px 11px;min-height:38px;gap:6px}
 nav h3{margin:10px 0 4px}
 main h2{font-size:26px}
 .drow{grid-template-columns:minmax(0,1fr) 36px}.drow>div{grid-column:1/-1;grid-row:2}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.xclose{display:none}
@media(max-width:760px){
 header{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
 .hrow{flex-wrap:nowrap;gap:8px}
 h1{font-size:19px}
 .patch{display:none}
 #q{flex:1 1 auto;min-width:0;padding:9px 12px;min-height:42px}
 .deckbtn{min-height:42px;padding:0 12px}
 .wrap{padding:10px 0 110px;gap:6px}
 nav{gap:0}
 nav h3{display:none}
 .tl{flex-wrap:nowrap;overflow-x:auto;padding:4px 12px;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .tl::-webkit-scrollbar{display:none}
 .tl::before{content:attr(data-g);flex:none;align-self:center;font-size:12px;font-weight:700;color:var(--sub);margin-right:2px}
 .tb{flex:none;white-space:nowrap;border-radius:20px;padding:6px 13px;min-height:38px}
 main{padding:0 12px}
 main h2{font-size:24px;margin-top:8px}
 .meta{margin-bottom:10px}
 .grid{grid-template-columns:minmax(0,1fr);gap:8px}
 .cc{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-left-width:5px}
 .cc:hover{transform:none}
 .pp{width:48px;height:48px;border-radius:9px}
 .chd{gap:10px}
 .cn{font-size:17px}
 .ct{font-size:12px}
 .mini{flex-direction:row;gap:4px}
 .mini .mi{width:34px;height:34px;border-radius:6px}
 .mn{display:none}
 #det.sheet{position:fixed;inset:0;z-index:20;margin:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;animation:fade .15s}
 #det.sheet .panel{width:100%;max-height:92vh;overflow-y:auto;border:0;border-radius:18px 18px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out;position:relative;overscroll-behavior:contain}
 #det:not(.sheet){display:none}
 .xclose{display:grid;place-items:center;position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);font-size:18px}
 .ph{padding-right:44px}
 .ph h2{font-size:26px}
 .pl{width:64px;height:64px}
 .add{width:100%;margin-top:4px}
 .iname{font-size:17px}
 #deck{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
 body.lock{overflow:hidden}
 footer{padding:0 12px 120px}
}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#det.sheet,#det.sheet .panel{animation:none}}

</style>
</head>
<body>
<header><div class="hrow">
 <h1>TFT <b>3신기</b></h1>
 <span class="patch">시즌 18 · 18.6 패치 통계</span>
 <input id="q" type="search" placeholder="챔피언·아이템 검색" autocomplete="off">
 <button class="deckbtn" id="deckOpen">내 덱 <span id="dc">0</span></button>
</div></header>

<div class="wrap">
 <nav id="nav"></nav>
 <main class="main">
  <div id="view"></div>
  <div id="det"></div>
 </main>
</div>

<footer>
 <b>시즌 18 · 18.6 패치 통계</b><br>챔피언·아이템 이미지는 Riot Data Dragon. 3신기 = seemeta.com 챔피언별 베스트 빌드 기준(18.6, 2026-11-22). 유물·찬란·상징·도적의 장갑은 빼고, 빠진 자리는 그 챔피언의 픽률 상위 일반 아이템으로 채움. 대체 아이템도 픽률 순. 특성 단계 숫자는 시즌 초 기준이라 패치로 바뀌었을 수 있음.
</footer>

<div id="deck">
 <div class="dh"><h2>내 덱 아이템</h2><div><button class="ghost" id="deckClear">비우기</button> <button class="ghost" id="deckClose">닫기</button></div></div>
 <div class="dbody" id="deckBody"></div>
</div>

const cp=k=>`<span class="cp" style="--c:${C[k].c}">${img(C[k].n,'ci')}${C[k].s}</span>`;
const dots=name=>img(name,'mi');
const card=c=>`<button class="cc${c.id===curC?' sel':''}" style="--cost:${COSTC[c.c]}" data-c="${c.id}" aria-label="${esc(c.n)} 3신기 보기">
 <span class="chd">${por(c.n,'pp')}<span><span class="cn">${esc(c.n)} <span class="cost">${c.c}코</span></span>
 <span class="ct">${c.t.map(esc).join(' · ')}</span></span></span>
 <span class="mini">${c.i.map(n=>`<div>${dots(n)}<span class="mn">${esc(n)}</span></div>`).join('')}</span></button>`;

function navHTML(){
 const g=['계열','직업','고유'];
 return g.map(x=>`<h3>${x}</h3><div class="tl" data-g="${x}">${T.filter(t=>t.g===x).map(t=>
  `<button class="tb${t.id===curT&&!query?' on':''}" data-t="${t.id}">${esc(t.n)} <span>${byT(t.n).length}</span></button>`).join('')}</div>`).join('');
}
function viewHTML(){
 if(query){
  const q=query.replace(/\s/g,'');
  const hits=CH.filter(c=>c.n.replace(/\s/g,'').includes(q)||c.t.some(t=>t.replace(/\s/g,'').includes(q))||c.i.some(i=>i.replace(/\s/g,'').includes(q)));
  return `<h2>‘${esc(query)}’ 검색</h2><div class="meta">${hits.length}명 · 챔피언·특성·아이템 이름으로 찾음</div>`+
   (hits.length?`<div class="grid">${hits.sort((a,b)=>a.c-b.c).map(card).join('')}</div>`:`<div class="empty">찾는 챔피언이 없어요.</div>`);
 }
 const t=tById(curT), list=byT(t.n);
 const bp=t.g==='고유'?'':`<span class="bp">${t.bp.map(b=>`<i>${b}</i>`).join('')}</span>`;
 return `<h2>${esc(t.n)}</h2><div class="meta">${t.g} · ${list.length}명${bp}</div>`+
  (TNOTE[t.n]?`<div class="note" style="margin:-6px 0 14px">${esc(TNOTE[t.n])}</div>`:'')+
  `<div class="grid">${list.map(card).join('')}</div>`;
}
function need(items){
 const m={};items.forEach(n=>I[n].forEach(k=>m[k]=(m[k]||0)+1));
 return Object.keys(C).filter(k=>m[k]).map(k=>`<span class="cp" style="--c:${C[k].c}">${img(C[k].n,'ci')}${C[k].s} <b>×${m[k]}</b></span>`).join('');
}
function detHTML(){
 const c=cById(curC); if(!c) return wide()?'<div class="ph0">챔피언을 누르면<br>3신기 조합법이 여기 나와요</div>':'';
 const inDeck=deck.includes(c.id);
 const tr=c.t.map(n=>`<button class="chip" data-tn="${esc(n)}">${esc(n)}</button>`).join('');
 return `<div class="panel" id="panel" style="--cost:${COSTC[c.c]}">
  <div class="ph"><div class="chd">${por(c.n,'pl')}<div><h2>${esc(c.n)} <span class="cost" style="font-size:15px;vertical-align:middle">${c.c}코</span></h2>
   <div class="chips">${tr}</div></div></div>
   <button class="add${inDeck?' in':''}" data-add="${c.id}">${inDeck?'✓ 내 덱에 있음':'+ 내 덱에 추가'}</button></div>
  <button class="xclose" data-close="1" aria-label="닫기">✕</button>
  <div class="sec">3신기</div>
  ${c.i.map((n,k)=>`<div class="it"><span class="num">${k+1}</span>${img(n,'bi')}<div><div class="iname">${esc(n)}</div>
   <div class="rec">${cp(I[n][0])} + ${cp(I[n][1])}</div></div></div>`).join('')}
  <div class="sec">필요한 재료 합계</div><div class="sum">${need(c.i)}</div>
  <div class="sec">대체 아이템 (재료가 안 맞을 때)</div>
  <div class="alts">${c.a.map(n=>`<div class="alt">${img(n,'ai')}<div><b>${esc(n)}</b><div class="rec">${cp(I[n][0])} + ${cp(I[n][1])}</div></div></div>`).join('')}</div>
  ${CNOTE[c.id]?`<div class="note">${esc(CNOTE[c.id])}</div>`:''}
 </div>`;
}
function deckHTML(){
 if(!deck.length) return '<div class="empty">챔피언 상세에서 “+ 내 덱에 추가”를 누르면 여기에 3신기가 모여요.</div>';
 const all=[];deck.forEach(id=>all.push(...cById(id).i));
 return deck.map(id=>{const c=cById(id);return `<div class="drow" style="--cost:${COSTC[c.c]}"><b class="chd">${por(c.n,'ps')}${esc(c.n)}</b>
  <div class="mini">${c.i.map(n=>`<div>${dots(n)}${esc(n)}</div>`).join('')}</div>
  <button class="x" data-rm="${c.id}" aria-label="빼기">✕</button></div>`}).join('')+
  `<div class="sec">덱 전체 필요 재료</div><div class="sum">${need(all)}</div>`;
}
const $=s=>document.querySelector(s);
const wide=()=>matchMedia('(min-width:1120px)').matches;
const mobile=()=>matchMedia('(max-width:760px)').matches;
function render(scroll){
 $('#nav').innerHTML=navHTML();
 $('#view').innerHTML=viewHTML();
 $('#det').innerHTML=detHTML();
 const sheet=!wide()&&!!curC; $('#det').classList.toggle('sheet',sheet); document.body.classList.toggle('lock',sheet&&mobile());
 if(sheet){const p=$('#panel');if(p)p.scrollTop=0}
 $('#dc').textContent=deck.length;
 $('#deckBody').innerHTML=deckHTML();
 if(scroll&&curC&&!wide()&&!mobile()){const p=$('#panel');if(p)p.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})}
}
/* 해시: #t-elderwood / #c-xayah */
function fromHash(){
 const h=location.hash.slice(1);
 const wasSheet=!!curC&&mobile(); const prevT=curT;
 if(h.startsWith('t-')&&tById(h.slice(2))){curT=h.slice(2);curC=null;query='';$('#q').value=''}
 else if(!h){curC=null}
 else if(h.startsWith('c-')&&cById(h.slice(2))){curC=h.slice(2)}
 render(h.startsWith('c-'));
 if(h.startsWith('t-')&&!(wasSheet&&prevT===curT)){if(mobile()){const v=$('#view');window.scrollTo({top:v.getBoundingClientRect().top+scrollY-118})}else window.scrollTo({top:0})}
}
const go=h=>{if(location.hash==='#'+h)fromHash();else location.hash=h};

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){go('t-'+b.dataset.t)}
 else if(b.dataset.c){
  const c=cById(b.dataset.c);
  if(!query&&!c.t.includes(tById(curT).n)&&!(c.id==='lux'&&LUX_ORIGINS.includes(tById(curT).n))){curT=tByN(c.t[0])?.id||curT}
  go('c-'+b.dataset.c)}
 else if(b.dataset.tn){const t=tByN(b.dataset.tn);if(t)go('t-'+t.id)}
 else if(b.dataset.add){const id=b.dataset.add;deck=deck.includes(id)?deck.filter(x=>x!==id):[...deck,id];saveDeck();render()}
 else if(b.dataset.close){go(query?'':'t-'+curT);if(query){curC=null;render()}}
 else if(b.dataset.rm){deck=deck.filter(x=>x!==b.dataset.rm);saveDeck();render()}
});
$('#deckOpen').onclick=()=>$('#deck').classList.toggle('open');
$('#deckClose').onclick=()=>$('#deck').classList.remove('open');
$('#deckClear').onclick=()=>{deck=[];saveDeck();render()};
$('#q').addEventListener('input',e=>{query=e.target.value.trim();curC=null;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#deck').classList.remove('open');if(curC&&mobile()){curC=null;render()}}});
$('#det').addEventListener('click',e=>{if(e.target.id==='det'){curC=null;if(!query)go('t-'+curT);else render()}});
window.addEventListener('hashchange',fromHash);
matchMedia('(min-width:1120px)').addEventListener('change',()=>render());
fromHash();
}
</script>
</body>
</html>
